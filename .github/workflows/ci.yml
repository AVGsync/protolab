name: ci

# Pull-request checks. release.yml calls this workflow (workflow_call) as its quality gate, so a merge to
# main is released only if exactly these checks pass on the merge commit.
on:
  pull_request:
  merge_group:
  workflow_call:

# One live run per PR; a newer push cancels the older run. Under workflow_call the group is unique per
# caller run, so the release gate never cancels itself.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  frontend:
    name: frontend (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install, typecheck, lint, test, build
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm run lint -- --max-warnings=0
          npm test
          npm run build # writes into ../internal/webui/dist
      - name: Build output is complete and works offline
        run: |
          test -s internal/webui/dist/index.html
          ls internal/webui/dist/assets/*.js > /dev/null
          # The UI is opened from a local binary: no CDN, no external fonts, no telemetry.
          if grep -rhoE "https?://[a-zA-Z0-9.-]+" internal/webui/dist --include=*.js --include=*.css --include=*.html \
             | grep -vE "^https?://(www\.w3\.org|localhost|127\.0\.0\.1|react\.dev|reactrouter\.com)" | sort -u | grep . ; then
            echo "::error::external URL in the embedded bundle"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: webui
          path: internal/webui/dist
          retention-days: 1
          if-no-files-found: error

  go:
    name: go (tidy, fmt, vet, test -race)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff
      - name: gofmt
        run: |
          out="$(gofmt -l cmd internal)"
          if [ -n "$out" ]; then echo "::error::gofmt needed for:"; echo "$out"; exit 1; fi
      # Never ./... : after npm ci it would also pick up Go files inside frontend/node_modules.
      # internal/webui/dist/README.md is tracked, so //go:embed all:dist compiles without a frontend build.
      - run: go vet ./cmd/... ./internal/...
      - name: go test -race
        env:
          CGO_ENABLED: "1" # the race detector needs cgo; release binaries are built with CGO_ENABLED=0
        run: go test -race -count=1 -timeout 10m ./cmd/... ./internal/...

  smoke:
    name: binary smoke test
    needs: [frontend, go]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/download-artifact@v8
        with:
          name: webui
          path: internal/webui/dist
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-X main.version=0.0.0-ci" -o bin/protolab ./cmd/protolab
      - name: CLI, server, embedded UI, demo project, report reproduction
        run: |
          set -euo pipefail
          data="$(mktemp -d)"
          ./bin/protolab version | grep -F 0.0.0-ci > /dev/null
          ./bin/protolab demo --data "$data"
          ./bin/protolab --no-tui --data "$data" --addr 127.0.0.1:7420 > server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; tail -n 30 server.log' EXIT
          for _ in $(seq 1 50); do curl -fsS http://127.0.0.1:7420/api/v1/system/info > /dev/null && break; sleep 0.2; done
          curl -fsS http://127.0.0.1:7420/ | grep -F '<div id="root">' > /dev/null
          curl -fsS http://127.0.0.1:7420/projects/any/route | grep -F '<div id="root">' > /dev/null
          curl -fsS http://127.0.0.1:7420/api/v1/projects | grep -F 'TC-200' > /dev/null
          # DNS rebinding and CSRF guards.
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.example' http://127.0.0.1:7420/api/v1/projects)" = 403
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Origin: https://evil.example' \
            -H 'Content-Type: application/json' -d '{"name":"x"}' http://127.0.0.1:7420/api/v1/projects)" = 403

  cross:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # Catches GOOS-specific compile errors (TUI, browser launcher, paths) before they break a release.
      - name: go build + go vet for the target
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build ./cmd/... ./internal/...
          go vet ./cmd/... ./internal/...

  # Single required status check for branch protection.
  ok:
    name: ok
    if: ${{ always() }}
    needs: [frontend, go, smoke, cross]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "* | *" skipped "*) exit 1 ;;
          esac
