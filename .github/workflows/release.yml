name: release

# Every merge to main: the same checks as a pull request -> six cross-compiled binaries with the embedded
# web UI -> tag vMAJOR.MINOR.<run_number> -> GitHub Release. No manual tags: MAJOR.MINOR comes from the
# VERSION file, the patch is github.run_number (only grows, unchanged on "Re-run jobs").
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and attach the archives to the run, but do not create a tag or a release
        type: boolean
        default: true

# Serialise releases and never cancel one that may be halfway through publishing. Workflow-level on
# purpose: a job-level group would let a faster run overtake an older one and invert the tag order.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: verify
    uses: ./.github/workflows/ci.yml

  release:
    name: build and publish
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write # create the tag and the release; nothing else
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # gh uses GH_TOKEN, nothing is pushed with git

      - name: Compute version
        id: v
        run: |
          base=0.1
          if [[ -f VERSION ]]; then base="$(tr -d '[:space:]' < VERSION)"; fi
          if ! [[ "$base" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=VERSION::expected MAJOR.MINOR (for example 0.1), got '${base}'"
            exit 1
          fi
          version="${base}.${GITHUB_RUN_NUMBER}"
          {
            echo "version=${version}"
            echo "tag=v${version}"
            echo "date=$(TZ=UTC git show -s --date=format-local:%Y-%m-%dT%H:%M:%SZ --format=%cd "${GITHUB_SHA}")"
          } >> "$GITHUB_OUTPUT"
          echo "Building v${version} from ${GITHUB_SHA}"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # The web UI is built once and embedded into all six binaries.
      - name: Build web UI
        run: make web

      - name: Cross-compile, archive, checksum
        env:
          VERSION: ${{ steps.v.outputs.version }}
          DATE: ${{ steps.v.outputs.date }}
        run: make release-local VERSION="$VERSION" COMMIT="$GITHUB_SHA" DATE="$DATE"

      - name: Verify artifacts
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          cd dist
          shopt -s nullglob
          archives=(./*.tar.gz ./*.zip)
          test "${#archives[@]}" -eq 6 # 4 unix tar.gz + 2 windows zip
          sha256sum -c SHA256SUMS
          # No `grep -q` after a pipe: with pipefail it can SIGPIPE the producer (exit 141).
          tar -tzf "protolab_${VERSION}_linux_amd64.tar.gz" | grep -x "protolab_${VERSION}_linux_amd64/protolab" > /dev/null
          tar -tzf "protolab_${VERSION}_linux_amd64.tar.gz" | grep -x "protolab_${VERSION}_linux_amd64/THIRD_PARTY_NOTICES.md" > /dev/null
          unzip -l "protolab_${VERSION}_windows_amd64.zip" | grep -F "protolab.exe" > /dev/null
          # The ldflags really reached main and the web UI is really embedded.
          bin="stage/protolab_${VERSION}_linux_amd64/protolab"
          out="$("$bin" version)"
          echo "$out"
          grep -qF "$VERSION" <<< "$out" || { echo "::error::binary does not report version ${VERSION}"; exit 1; }
          data="$(mktemp -d)"
          "$bin" --no-tui --data "$data" --addr 127.0.0.1:7421 > /dev/null 2>&1 &
          pid=$!
          for _ in $(seq 1 50); do curl -fsS http://127.0.0.1:7421/api/v1/system/info > /dev/null && break; sleep 0.2; done
          page="$(curl -fsS http://127.0.0.1:7421/)"
          kill "$pid"
          grep -qF '<div id="root">' <<< "$page" || { echo "::error::web UI is not embedded"; exit 1; }
          ls -lh ./*.tar.gz ./*.zip

      - name: Attach archives to the run (dry run)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v7
        with:
          name: protolab-${{ steps.v.outputs.version }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

      - name: Publish GitHub Release
        if: ${{ github.ref == 'refs/heads/main' && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          # Re-run of the same run (same run_number, same commit): already released, nothing to do.
          # The same tag on another commit means the counter went backwards: refuse loudly.
          existing="$(gh api "repos/${GH_REPO}/git/ref/tags/${TAG}" --jq '.object.sha' 2>/dev/null || true)"
          if [[ -n "$existing" ]]; then
            if [[ "$existing" == "$GITHUB_SHA" ]]; then
              echo "::notice::${TAG} already exists at ${GITHUB_SHA}; nothing to publish"
              exit 0
            fi
            echo "::error::tag ${TAG} already exists at ${existing}, this run builds ${GITHUB_SHA}. Raise MAJOR.MINOR in VERSION."
            exit 1
          fi

          prev="$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')"
          args=(
            --target "$GITHUB_SHA"
            --title "ProtoLab ${TAG}"
            --generate-notes
            --latest
            --notes "Один бинарь: терминальный интерфейс и встроенный веб-интерфейс. Распакуйте архив для своей ОС и запустите \`protolab\`; клавиша \`o\` откроет интерфейс в браузере. Проверка загрузки: \`sha256sum -c SHA256SUMS --ignore-missing\`."
          )
          if [[ -n "$prev" ]]; then args+=(--notes-start-tag "$prev"); fi

          # With asset files gh creates a draft, uploads everything, then publishes: no half-empty releases.
          gh release create "$TAG" dist/*.tar.gz dist/*.zip dist/SHA256SUMS "${args[@]}"

          {
            echo "### Released ${TAG}"
            echo
            gh release view "$TAG" --json url --jq .url
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
