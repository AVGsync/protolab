name: release

# Every merge to main: the same checks as a pull request -> six cross-compiled binaries with the embedded
# web UI -> tag vMAJOR.MINOR.<run_number> -> GitHub Release. No manual tags: MAJOR.MINOR comes from the
# VERSION file, the patch is github.run_number (only grows, unchanged on "Re-run jobs").
#
# A release is created only by a push to main. workflow_dispatch (any branch) runs the identical build and
# verification but never tags or publishes: the archives are attached to the run for inspection.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialise releases and never cancel one that may be halfway through publishing. Workflow-level on
# purpose: a job-level group would let a faster run overtake an older one and invert the tag order.
# Manual dry runs get a group of their own: they publish nothing, and sharing the "release" group would let
# a dry run replace (cancel) a release run that is waiting in the queue.
concurrency:
  group: ${{ github.event_name == 'push' && 'release' || format('dry-run-{0}', github.run_id) }}
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: verify
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read # a called workflow can only keep or lower the caller's token permissions

  release:
    name: build and publish
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write # create the tag and the release; nothing else
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false # gh uses GH_TOKEN, nothing is pushed with git

      - name: Compute version
        id: v
        run: |
          base=0.1
          if [[ -f VERSION ]]; then base="$(tr -d '[:space:]' < VERSION)"; fi
          if ! [[ "$base" =~ ^[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=VERSION::expected MAJOR.MINOR (for example 0.1), got '${base}'"
            exit 1
          fi
          version="${base}.${GITHUB_RUN_NUMBER}"
          {
            echo "version=${version}"
            echo "tag=v${version}"
            echo "date=$(TZ=UTC git show -s --date=format-local:%Y-%m-%dT%H:%M:%SZ --format=%cd "${GITHUB_SHA}")"
          } >> "$GITHUB_OUTPUT"
          echo "Building v${version} from ${GITHUB_SHA}"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      # The web UI is built once and embedded into all six binaries.
      - name: Build web UI
        run: make web

      - name: Cross-compile, archive, checksum
        env:
          VERSION: ${{ steps.v.outputs.version }}
          DATE: ${{ steps.v.outputs.date }}
        run: make release-local VERSION="$VERSION" COMMIT="$GITHUB_SHA" DATE="$DATE"

      # scripts/verify-dist.sh (also `make verify-dist` locally): archive set, SHA256SUMS, notices vs `go version -m`
      # of every binary, GOOS/GOARCH/CGO flags, and the linux/amd64 binary really starts and serves the web UI.
      - name: Verify artifacts
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: make verify-dist VERSION="$VERSION"

      - name: Attach archives to the run (manual dry run)
        if: ${{ github.event_name != 'push' }}
        uses: actions/upload-artifact@v7
        with:
          name: protolab-${{ steps.v.outputs.version }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
          overwrite: true # a re-run of the same run uploads the same name again

      - name: Publish GitHub Release
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          # Re-run of the same run (same run_number, same commit): already released, nothing to do.
          # The same tag on another commit means the counter went backwards: refuse loudly.
          # matching-refs answers 200 with [] when there is no such tag. (git/ref/tags/X answers 404, and gh
          # prints the JSON error body to stdout, which would look like an existing tag.) It matches by
          # prefix (v0.1.4 also lists v0.1.40...), hence the exact-name filter and --paginate.
          existing="$(gh api --paginate "repos/${GH_REPO}/git/matching-refs/tags/${TAG}" \
            --jq '.[] | select(.ref == "refs/tags/" + env.TAG) | .object.sha')"
          if [[ -n "$existing" && "$existing" != "$GITHUB_SHA" ]]; then
            echo "::error::tag ${TAG} already exists at ${existing}, this run builds ${GITHUB_SHA}. Raise MAJOR.MINOR in VERSION."
            exit 1
          fi
          if [[ -n "$existing" ]] && gh release view "$TAG" > /dev/null 2>&1; then
            echo "::notice::${TAG} is already released from ${GITHUB_SHA}; nothing to publish"
            exit 0
          fi

          prev="$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')"
          # Re-running an old failed run after a newer release must not turn the old build into "Latest".
          if [[ -n "$prev" && "$(printf '%s\n%s\n' "$prev" "$TAG" | sort -V | tail -n 1)" != "$TAG" ]]; then
            echo "::error::release ${prev} is newer than ${TAG}; not publishing an older build as the latest release"
            exit 1
          fi
          args=(
            --target "$GITHUB_SHA"
            --title "ProtoLab ${TAG}"
            --generate-notes
            --latest
            --notes "Один бинарь: терминальный интерфейс и встроенный веб-интерфейс. Распакуйте архив для своей ОС и запустите \`protolab\`; клавиша \`o\` откроет интерфейс в браузере. Проверка загрузки: \`sha256sum -c SHA256SUMS --ignore-missing\`."
          )
          if [[ -n "$prev" ]]; then args+=(--notes-start-tag "$prev"); fi

          # With asset files gh creates a draft, uploads everything, then publishes: no half-empty releases.
          gh release create "$TAG" dist/*.tar.gz dist/*.zip dist/SHA256SUMS "${args[@]}"

          {
            echo "### Released ${TAG}"
            echo
            gh release view "$TAG" --json url --jq .url
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
